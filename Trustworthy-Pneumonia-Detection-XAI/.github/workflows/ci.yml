name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run import and smoke tests
        run: |
          python -m pytest tests/ -v

      - name: Verify CLI help messages
        run: |
          python -m training.train --help
          python -m evaluation.calibrate --help
          python -m evaluation.evaluate --help
          python -m inference.predict --help
          python scripts/prepare_dataset.py --help
          python scripts/demo.py --help
