<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Lung Fill Gradient -->
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Shield Base -->
  <path
    d="M 32 4 
       C 48 4 56 12 56 26 
       C 56 42 42 54 32 60 
       C 22 54 8 42 8 26 
       C 8 12 16 4 32 4 Z"
    fill="url(#shieldBg)"
    stroke="url(#shieldBorder)"
    stroke-width="2"
  />

  <!-- Subtle Shield Inner Tech Rings -->
  <path
    d="M 32 8 
       C 45 8 52 15 52 26 
       C 52 39 40 49 32 55 
       C 24 49 12 39 12 26 
       C 12 15 19 8 32 8 Z"
    fill="none"
    stroke="rgba(56, 189, 248, 0.15)"
    stroke-width="1"
    stroke-dasharray="3 2"
  />

  <!-- Trachea (Central Airway) -->
  <path d="M 31 14 L 33 14 L 33 24 L 31 24 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="31" y1="17" x2="33" y2="17" stroke="#38bdf8" stroke-width="1" />
  <line x1="31" y1="20" x2="33" y2="20" stroke="#38bdf8" stroke-width="1" />

  <!-- Main Bronchi (Branching Airways) -->
  <path d="M 31 24 C 29 27 25 30 20 33" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 33 24 C 35 27 39 30 44 33" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Secondary Airway Strands -->
  <path d="M 23 29 C 19 28 16 32 14 36" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1" stroke-dasharray="2 1" />
  <path d="M 41 29 C 45 28 48 32 50 36" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1" stroke-dasharray="2 1" />

  <!-- Left Lung Lobe -->
  <path
    d="M 30 25 
       C 26 18 17 21 15 31 
       C 13 40 15 48 18 51 
       C 23 53 29 50 31 44 
       C 32 37 32 30 30 25 Z"
    fill="url(#lungGrad)"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Right Lung Lobe -->
  <path
    d="M 34 25 
       C 38 18 47 21 49 31 
       C 51 40 49 48 46 51 
       C 41 53 35 50 33 44 
       C 32 37 32 30 34 25 Z"
    fill="url(#lungGrad)"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Trust Pulse & Verification Heartbeat Overlay -->
  <path
    d="M 12 36 L 22 36 L 25 31 L 28 42 L 32 27 L 36 44 L 39 36 L 52 36"
    fill="none"
    stroke="#10b981"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Focal Verification Checkpoint / Confidence Node -->
  <circle cx="32" cy="27" r="2.2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="32" cy="27" r="4.5" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8" stroke-dasharray="2 1" />
</svg>
